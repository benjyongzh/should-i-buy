name: checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lab_test
          POSTGRES_USER: lab_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lab_test" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend
        env: {TEST_POSTGRES_URL: 'postgresql+psycopg://lab_test@localhost:5432/lab_test'}
      - run: python -m ruff check . && python -m ruff format --check .
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
