name: trading-lab
x-backend: &backend
  build: {context: ., dockerfile: backend/Dockerfile}
  env_file: .env
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set an external PostgreSQL DATABASE_URL in .env}
  init: true
  restart: unless-stopped
  mem_limit: 1g
services:
  migrate:
    <<: *backend
    command: [python, -m, alembic, upgrade, head]
    restart: "no"
  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    cpus: 1
    mem_limit: 2g
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
